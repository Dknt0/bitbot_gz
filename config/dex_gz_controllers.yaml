controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

effort_controller:
  ros__parameters:
    type: effort_controllers/JointGroupEffortController
    # NOTE: keep this list alphabetically sorted. The order must match the
    # /joint_states name order (ros2_control exports interfaces sorted),
    # commands are indexed accordingly.
    joints:
      - ankle_pitch_l_joint
      - ankle_pitch_r_joint
      - ankle_roll_l_joint
      - ankle_roll_r_joint
      - elbow_pitch_l_joint
      - elbow_pitch_r_joint
      - elbow_yaw_l_joint
      - elbow_yaw_r_joint
      - hip_pitch_l_joint
      - hip_pitch_r_joint
      - hip_roll_l_joint
      - hip_roll_r_joint
      - hip_yaw_l_joint
      - hip_yaw_r_joint
      - knee_pitch_l_joint
      - knee_pitch_r_joint
      - shoulder_pitch_l_joint
      - shoulder_pitch_r_joint
      - shoulder_roll_l_joint
      - shoulder_roll_r_joint
      - shoulder_yaw_l_joint
      - shoulder_yaw_r_joint
      - waist_pitch_joint
      - waist_roll_joint
      - waist_yaw_joint
      - wrist_pitch_l_joint
      - wrist_pitch_r_joint
      - wrist_roll_l_joint
      - wrist_roll_r_joint
